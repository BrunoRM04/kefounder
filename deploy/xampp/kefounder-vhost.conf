# KeFounder! en XAMPP. Copiar a C:/xampp/apache/conf/extra/kefounder-vhost.conf.
# En httpd.conf agregar Listen 8080, habilitar mod_proxy_http y agregar:
# Include conf/extra/kefounder-vhost.conf
# El backend Node debe seguir corriendo en 127.0.0.1:3000.
<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot "C:/xampp/htdocs/kefounder"
    ProxyPreserveHost On

    ProxyPass        "/api/"     "http://127.0.0.1:3000/api/"
    ProxyPassReverse "/api/"     "http://127.0.0.1:3000/api/"
    ProxyPass        "/uploads/" "http://127.0.0.1:3000/uploads/"
    ProxyPassReverse "/uploads/" "http://127.0.0.1:3000/uploads/"

    <Directory "C:/xampp/htdocs/kefounder">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>
</VirtualHost>
